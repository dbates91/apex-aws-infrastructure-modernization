version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "terraform"
    directory: "/terraform/modules/networking"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
